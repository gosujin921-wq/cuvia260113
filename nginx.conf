server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  location /v1 {
    proxy_pass http://192.168.102.102:16000;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
  }

    location /api {
    proxy_pass http://192.168.102.101:9090;
    proxy_http_version 1.1;

    # CORS 헤더 추가
    add_header 'Access-Control-Allow-Origin' '*' always;
    add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
    add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;
    add_header 'Access-Control-Expose-Headers' 'Content-Length,Content-Range' always;

    # OPTIONS preflight 요청 처리
    if ($request_method = 'OPTIONS') {
      add_header 'Access-Control-Allow-Origin' '*';
      add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS';
      add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization';
      add_header 'Access-Control-Max-Age' 1728000;
      add_header 'Content-Type' 'text/plain; charset=utf-8';
      add_header 'Content-Length' 0;
      return 204;
    }

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
  }

  location /gitsmap-proxy/ {
    proxy_pass https://gitsmap.gg.go.kr/;
    proxy_ssl_server_name on;
    proxy_set_header Host gitsmap.gg.go.kr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # UTIC WMS (gis.utic.go.kr) - CORS 대응
  location /utic-wms-proxy/ {
    proxy_pass https://gis.utic.go.kr/;
    proxy_ssl_server_name on;
    proxy_set_header Host gis.utic.go.kr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location /roadplus-proxy/ {
    proxy_pass https://www.roadplus.co.kr/;
    proxy_ssl_server_name on;
    proxy_set_header Host www.roadplus.co.kr;
    proxy_set_header Referer "https://www.roadplus.co.kr/";
    proxy_set_header Origin "https://www.roadplus.co.kr";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # ===== ITS 국가교통정보센터 WMTS 프록시 =====
  # CORS 해결 + 캐시 전략 + 타임아웃 제어
  # 
  # [중요] 캐시 활성화를 위해 메인 nginx.conf의 http 블록에 아래 추가 필요:
  # proxy_cache_path /var/cache/nginx/its_cache levels=1:2 keys_zone=its_cache:10m max_size=100m inactive=10m use_temp_path=off;
  #
  location /its-proxy/ {
    proxy_pass https://its.go.kr:9443/;
    proxy_ssl_server_name on;
    proxy_set_header Host its.go.kr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    # CORS 헤더 추가
    add_header 'Access-Control-Allow-Origin' '*' always;
    add_header 'Access-Control-Allow-Methods' 'GET, OPTIONS' always;
    add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range' always;

    # OPTIONS preflight 요청 처리
    if ($request_method = 'OPTIONS') {
      add_header 'Access-Control-Allow-Origin' '*';
      add_header 'Access-Control-Allow-Methods' 'GET, OPTIONS';
      add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range';
      add_header 'Access-Control-Max-Age' 1728000;
      add_header 'Content-Type' 'text/plain; charset=utf-8';
      add_header 'Content-Length' 0;
      return 204;
    }

    # 타임아웃 설정 (권장: 2~5초)
    proxy_connect_timeout 5s;
    proxy_send_timeout 5s;
    proxy_read_timeout 5s;

    # ===== 요청 속도 제한 (5순위 최적화) =====
    # burst=30: 순간적으로 30개까지 초과 허용 (큐에 대기)
    # nodelay: 대기 없이 즉시 처리 (burst 내에서)
    limit_req zone=its_limit burst=30 nodelay;

    # ===== 캐시 활성화 (1순위 최적화) =====
    # 캐시 존 사용 (http 블록에 proxy_cache_path 정의 필요)
    proxy_cache its_cache;
    proxy_cache_key $uri$is_args$args;
    
    # 캐시 TTL 설정 (2순위: 120초로 증가하여 요청 빈도 감소)
    proxy_cache_valid 200 120s;
    proxy_cache_valid 404 1m;
    
    # 에러/타임아웃 시 stale 캐시 사용 (500 에러 대응)
    proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
    proxy_cache_background_update on;
    proxy_cache_lock on;
    
    # 캐시 상태 헤더 (디버깅용: HIT/MISS/STALE 확인)
    add_header X-Cache-Status $upstream_cache_status always;

    # 클라이언트 캐시 헤더 (120초 + stale 180초)
    add_header Cache-Control "public, max-age=120, stale-while-revalidate=180" always;
  }

  # ===== SPA Routing =====
  location / {
    try_files $uri $uri/ /index.html;
  }
}